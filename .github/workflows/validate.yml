name: Validate Plugin Builder

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_neuron_map.py
      - run: python scripts/test_neuron_map.py
      - run: python -m py_compile scripts/*.py
      - run: python scripts/test_plugin_tooling.py
      - run: python scripts/test_command_layer.py
      - name: Build ChatGPT Plugin package
        run: python scripts/build_chatgpt_plugin.py --version 0.3.1 --output dist/Plugin-Builder-ChatGPT-v0.3.1.zip
      - name: Inspect package
        run: |
          python - <<'PY'
          import json, zipfile
          p='dist/Plugin-Builder-ChatGPT-v0.3.1.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              required=[
                  'plugin-builder/plugin.json',
                  'plugin-builder/skills/plugin-builder/SKILL.md',
                  'plugin-builder/skills/plugin-builder/NEURON_MAP.md',
                  'plugin-builder/skills/plugin-builder/agents/openai.yaml',
                  'plugin-builder/skills/plugin-builder/references/command-layer.md',
                  'plugin-builder/skills/plugin-builder/scripts/command_layer.py',
                  'plugin-builder/skills/plugin-builder/scripts/test_command_layer.py',
                  'plugin-builder/skills/plugin-builder/knowledge/20-plugin-lifecycle-execution-creator-parity.md',
                  'plugin-builder/skills/plugin-builder/references/creator-parity-execution.md',
                  'plugin-builder/skills/plugin-builder/evaluation/CREATOR_PARITY_MATRIX.md',
                  'plugin-builder/skills/plugin-builder/evaluation/BUILDER_BENCHMARK.md'
              ]
              for item in required:
                  assert item in names, item
              manifest=json.loads(z.read('plugin-builder/plugin.json'))
              assert manifest['version']=='0.3.1'
              skill=z.read('plugin-builder/skills/plugin-builder/SKILL.md').decode()
              assert 'create_personal_plugin' in skill
              cmd=z.read('plugin-builder/skills/plugin-builder/references/command-layer.md').decode()
              assert 'intent aliases' in cmd
          print('ChatGPT package v0.3.1: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-builder-chatgpt-v0.3.1
          path: dist/Plugin-Builder-ChatGPT-v0.3.1.zip
          if-no-files-found: error
